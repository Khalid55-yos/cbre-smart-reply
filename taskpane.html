<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Reply</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-wrap">
        <img src="icons/icon-32.png" alt="Smart Reply" class="logo" />
        <div>
          <h1>Smart Reply</h1>
          <p class="sub">CBRE LA North Capital Markets</p>
        </div>
      </div>
    </header>

    <div id="status-card" class="card status-loading">
      <div class="status-row">
        <div class="status-dot"></div>
        <span id="status-text">Analyzing the email…</span>
      </div>
    </div>

    <div id="detection-card" class="card hidden">
      <label class="field-label">Detected Listing</label>
      <select id="listing-select" class="select">
        <option value="">Loading listings…</option>
      </select>
      <p id="detection-hint" class="hint"></p>
    </div>

    <div id="preview-card" class="card hidden">
      <label class="field-label">Reply Preview</label>
      <div id="preview-body" class="preview"></div>
      <div class="attach-row">
        <svg class="paperclip" viewBox="0 0 24 24" width="14" height="14"><path d="M16.5 6v11.5a4.5 4.5 0 0 1-9 0V5a3 3 0 0 1 6 0v11.5a1.5 1.5 0 0 1-3 0V6h-1v10.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1z" fill="currentColor"/></svg>
        <span id="attachment-name">No file</span>
      </div>
    </div>

    <button id="insert-button" class="primary-button hidden">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2V10z" fill="currentColor" opacity="0.0"/><path d="M2 12l5 5L22 4" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Open Reply with OM Attached
    </button>

    <div id="error-card" class="card error hidden">
      <p id="error-text"></p>
    </div>

    <footer class="footer">
      <span>v3.0 · personal sideload</span>
    </footer>
  </div>

  <script type="text/javascript" src="taskpane.js"></script>
</body>
</html>
