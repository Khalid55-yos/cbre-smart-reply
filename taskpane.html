<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Smart Reply v3.1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="logo-wrap">
        <div class="owl">🦉</div>
        <div>
          <h1 class="title">Smart Reply</h1>
          <div class="subtitle">v3.1 — AI Drafts</div>
        </div>
      </div>
    </header>

    <section class="card">
      <label class="label" for="listing-select">Listing</label>
      <select id="listing-select" class="select">
        <option value="141 S Lake Ave">141 S Lake Ave</option>
      </select>

      <div class="label">Include in reply</div>
      <div class="checkbox-group">
        <label class="checkbox-row">
          <input type="checkbox" id="include-vdr" checked>
          <span class="checkbox-text">
            <strong>Virtual Deal Room</strong>
            <span class="checkbox-hint">External-facing; prospect signs CA to access materials</span>
          </span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="include-om">
          <span class="checkbox-text">
            <strong>Direct OM PDF</strong>
            <span class="checkbox-hint">Requires CBRE login — internal/trusted use only</span>
          </span>
        </label>
      </div>

      <button id="generate-btn" class="btn-primary">
        <span class="btn-label">Generate AI Reply</span>
      </button>

      <div id="status" class="status hidden"></div>
    </section>

    <section class="info">
      <p class="info-text">
        AI drafts use real listing data from Dataverse. Always review before sending.
      </p>
    </section>
  </main>

  <script src="taskpane.js"></script>
</body>
</html>
